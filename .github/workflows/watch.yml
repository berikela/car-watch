name: Watch myauto.ge

on:
  schedule:
    # Every 10 minutes, off the busy :00 mark. GitHub runs schedules late and skips
    # some when it is busy, so real gaps can be much longer.
    - cron: "7-57/10 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test notification with the 3 newest matches"
        type: boolean
        default: false

permissions:
  contents: write   # to save seen.json back to the repository
  issues: write     # to notify through a GitHub issue when no email secrets are set

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Send test notification
        if: ${{ inputs.test_email }}
        run: python watcher.py --test-email

      - name: Check for new listings
        if: ${{ !inputs.test_email }}
        run: python watcher.py

      - name: Remember seen listings
        if: ${{ !inputs.test_email }}
        run: |
          # GitHub switches scheduled workflows off after 60 days without a commit,
          # so commit a heartbeat whenever the last commit is over 30 days old.
          last_commit=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last_commit )) -gt $(( 30 * 24 * 3600 )) ]; then
            date -u +%Y-%m-%d > heartbeat.txt
          fi
          git add seen.json
          [ -f heartbeat.txt ] && git add heartbeat.txt
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update watcher state"
            git push
          fi
